syntax = "proto3";

package corepb;

// ============ 通用物品 ============
message Item {
    int64 id = 1;           // 物品ID
    int64 count = 2;        // 数量
    int64 expire_time = 3;  // 过期时间
    // field 4 reserved
    // google.protobuf.Any detail = 5;  // 详情 (略)
    int64 uid = 6;          // UID
    bool is_new = 7;        // 是否新获得
    repeated int64 mutant_types = 8; // 变异类型
    // ItemShow show = 100;  // 展示信息 (略)
}

// 背包（物品列表）
message ItemBag {
    repeated Item items = 1;
}

// ============ 物品变化 ============
message ItemChg {
    Item item = 1;          // 物品信息
    int64 delta = 2;        // 变化量 (正数增加, 负数减少)
}

message FacilityOpResult {
    int64 facility_inst_id = 1;
    int32 kind = 2;
    int64 target_id = 3;
    repeated Item rewards = 10;
    repeated Item costs = 11;
}

message ItemEntry {
    int64 id = 1;
    int64 count = 2;
}

message ItemRanchProduct {
    int64 src_item_id = 1;
    int64 src_animal_id = 2;
    int32 weight_x10 = 3;
    int32 tier = 4;
    int64 price_rate = 5;
    int64 base_point = 6;
}
