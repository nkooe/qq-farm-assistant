title = "QQ farm source secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 source file hashes, not API keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)core/src/__bolt_manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"]+\.js":\s*"[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Fixed password for the isolated Alice test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)core/test/admin-auth-roles\.test\.js$''']
regexTarget = "secret"
regexes = ['''^Alice-Test-123$''']
